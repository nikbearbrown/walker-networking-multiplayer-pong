<g font-size="12" text-anchor="middle">
<text x="720" y="166">set_pos_and_motion · unreliable</text>
<text x="720" y="181" fill="#5b6b7c">every frame · paddle.gd:24,36</text>
<text x="720" y="296">set_pos_and_motion · unreliable</text>
<text x="720" y="311" fill="#5b6b7c">every frame · paddle.gd:24,36</text>
<text x="720" y="414">bounce(left, randf) · any_peer</text>
<text x="720" y="429" fill="#5b6b7c">from the touched paddle's owner · paddle.gd:50</text>
<text x="720" y="480" fill="#5b6b7c">ball.gd:44-54 · same random on both peers</text>
<text x="720" y="541">update_score + _reset_ball · any_peer</text>
<text x="720" y="556" fill="#5b6b7c">host sends on x &lt; 0 · ball.gd:31-32</text>
<text x="720" y="615" fill="#5b6b7c">client sends on x &gt; 640 · ball.gd:40-41</text>
</g>

<!-- proposed -->
<g stroke="#d24e42" stroke-width="2" stroke-dasharray="7 5" fill="none">
<rect x="430" y="665" width="580" height="60" rx="8"/>
</g>
<g font-size="14" fill="#d24e42" text-anchor="middle">
<text x="720" y="690">proposed: sender check on any_peer RPCs (get_remote_sender_id)</text>
<text x="720" y="710">only if Q-07 decides the demo is not trusted-LAN · document first with T-14</text>
</g>
<text x="30" y="760" font-size="12" fill="#5b6b7c">Verified on loopback only: authority ids, paddle clamps, natural misses 1–1, left-paddle bounce, fixture win (match-*/terminal-*-20260924.log). No latency, WAN or security test.</text>
</g>
