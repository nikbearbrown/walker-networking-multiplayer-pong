<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="t d">
<title id="t">Authority and RPC map, host and client, recovered from pong.gd, paddle.gd, ball.gd</title>
<desc id="d">Which peer owns each node and which RPCs cross the wire; observed solid teal, proposed sender check dashed red. References F-02, F-03, F-04, F-05, F-06, S-01, S-02, S-03, R-01, Q-07, T-14.</desc>
<rect width="1440" height="780" fill="#faf9f5"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#287c68"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" fill="#25354a">
<text x="30" y="36" font-size="26" font-weight="700">Authority and RPC map · S-01 S-02 S-03</text>
<text x="30" y="58" font-size="14" fill="#5b6b7c">thick teal box = multiplayer authority on that peer · thin box = replica · arrows = RPCs observed in code · dashed red = proposed</text>

<!-- peer panels -->
<g fill="none" stroke="#25354a" stroke-width="1.5">
<rect x="30" y="80" width="560" height="560" rx="16"/>
<rect x="850" y="80" width="560" height="560" rx="16"/>
</g>
<text x="50" y="110" font-size="20" font-weight="700">HOST · peer 1 (server)</text>
<text x="1390" y="110" font-size="20" font-weight="700" text-anchor="end">CLIENT · peer n</text>

<!-- authority boxes -->
<g fill="#fffdf7">
<rect x="320" y="140" width="250" height="90" rx="10" stroke="#287c68" stroke-width="4"/>
<rect x="320" y="270" width="250" height="90" rx="10" stroke="#25354a" stroke-width="1.5"/>
<rect x="320" y="400" width="250" height="90" rx="10" stroke="#287c68" stroke-width="4"/>
<rect x="320" y="530" width="250" height="90" rx="10" stroke="#25354a" stroke-width="1.5"/>
<rect x="870" y="140" width="250" height="90" rx="10" stroke="#25354a" stroke-width="1.5"/>
<rect x="870" y="270" width="250" height="90" rx="10" stroke="#287c68" stroke-width="4"/>
<rect x="870" y="400" width="250" height="90" rx="10" stroke="#25354a" stroke-width="1.5"/>
<rect x="870" y="530" width="250" height="90" rx="10" stroke="#25354a" stroke-width="1.5"/>
</g>
<g text-anchor="middle">
<text x="445" y="178" font-size="17" font-weight="700">Player1 (left, cyan)</text>
<text x="445" y="200" font-size="12">AUTHORITY · default</text>
<text x="445" y="308" font-size="17" font-weight="700">Player2 (right, magenta)</text>
<text x="445" y="330" font-size="12">replica · pong.gd:22</text>
<text x="445" y="438" font-size="17" font-weight="700">Ball</text>
<text x="445" y="460" font-size="12">AUTHORITY · default (inferred)</text>
<text x="445" y="568" font-size="17" font-weight="700">Pong (scores)</text>
<text x="445" y="590" font-size="12">runs update_score locally</text>
<text x="995" y="178" font-size="17" font-weight="700">Player1 (left, cyan)</text>
<text x="995" y="200" font-size="12">replica</text>
<text x="995" y="308" font-size="17" font-weight="700">Player2 (right, magenta)</text>
<text x="995" y="330" font-size="12">AUTHORITY · pong.gd:25</text>
<text x="995" y="438" font-size="17" font-weight="700">Ball</text>
<text x="995" y="460" font-size="12">replica, simulated locally</text>
<text x="995" y="568" font-size="17" font-weight="700">Pong (scores)</text>
<text x="995" y="590" font-size="12">runs update_score locally</text>
</g>

<!-- side notes -->
<g font-size="12">
<text x="50" y="170">W/S, arrows, pad → move_up/down</text>
<text x="50" y="186" fill="#5b6b7c">paddle.gd:15 · 150 px/s · clamp 16..384</text>
<text x="50" y="430">owns LEFT goal line: x &lt; 0</text>
<text x="50" y="446" fill="#5b6b7c">ball.gd:24-32 → right scores</text>
<text x="50" y="560">win at 10 → stop.rpc()</text>
<text x="50" y="576" fill="#5b6b7c">pong.gd:39-49</text>
<text x="1140" y="300">W/S, arrows, pad → move_up/down</text>
<text x="1140" y="316" fill="#5b6b7c">paddle.gd:15</text>
<text x="1140" y="430">owns RIGHT goal line: x &gt; 640</text>
<text x="1140" y="446" fill="#5b6b7c">ball.gd:33-41 → left scores</text>
<text x="1140" y="560">win at 10 → stop.rpc()</text>
<text x="1140" y="576" fill="#5b6b7c">pong.gd:39-49</text>
</g>

