</g>
<g font-size="12" fill="#d24e42" text-anchor="middle">
<text x="80" y="580">T-12 proposed</text><text x="80" y="596">address in use</text>
<text x="575" y="692">T-11 proposed</text><text x="575" y="708">no server listening</text>
<text x="1165" y="720">T-10 proposed</text><text x="1165" y="736">client-side disconnect</text>
</g>
